name: Deploy web and app manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-and-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run backend:build

      - name: Typecheck app
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Export web app
        env:
          EXPO_PUBLIC_GENIUZ_API_URL: ${{ vars.EXPO_PUBLIC_GENIUZ_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$EXPO_PUBLIC_GENIUZ_API_URL" || -z "$EXPO_PUBLIC_SUPABASE_URL" || -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Set the three EXPO_PUBLIC_* GitHub Actions variables before deploying." >&2
            exit 1
          fi
          echo "Exporting commit $GITHUB_SHA"
          npx expo export --platform web

      - name: Warn when a new APK is needed
        run: |
          if git diff --quiet "${GITHUB_SHA}^" "$GITHUB_SHA" -- app.json package.json package-lock.json; then
            echo "No app config or native dependency changes detected in this commit."
          else
            echo "::warning::App config or native dependencies changed. This needs a new APK; an OTA update cannot provide native changes."
          fi

      - name: Deploy web to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Set CLOUDFLARE_API_TOKEN as a secret and CLOUDFLARE_ACCOUNT_ID as a variable." >&2
            exit 1
          fi
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Publish Android preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GENIUZ_API_URL: ${{ vars.EXPO_PUBLIC_GENIUZ_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Set the EXPO_TOKEN GitHub Actions secret before publishing." >&2
            exit 1
          fi
          npx eas-cli update --channel preview --platform android --message "Manual deploy $GITHUB_SHA" --non-interactive
